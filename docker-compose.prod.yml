networks:
  traefik-net:
    driver: overlay
    attachable: true

volumes:
  letsencrypt:

services:
  config-service:
    image: ${DOCKERHUB_USERNAME}/config-service:latest
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == gateway
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M

  registry-service:
    image: ${DOCKERHUB_USERNAME}/registry-service:latest
    ports:
      - target: 8761
        published: 8761
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == gateway
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  messagebroker-service:
    image: rabbitmq:3-management
    ports:
      - target: 5672
        published: 5672
        protocol: tcp
        mode: host
      - target: 15672
        published: 15672
        protocol: tcp
        mode: host
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == gateway
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
        reservations:
          cpus: "0.20"
          memory: 128M

  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:latest
    ports:
      - "8081:8001"
    volumes:
      - "./certs/global-bundle.pem:/certs/global-bundle.pem:ro"
    environment:
      - DATABASE_URL=${DB_URL_AUTH}
      - INSTANCE_HOST=172.31.17.179
      - APP_PORT=8081
      - EUREKA_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8761/eureka
      - RABBITMQ_HOST=ec2-16-171-110-76.eu-north-1.compute.amazonaws.com
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - CONFIG_SERVER_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8888
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == app
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    ports:
      - "8082:8000"
    volumes:
      - "./certs/global-bundle.pem:/certs/global-bundle.pem:ro"
    environment:
      - HOST_IP=172.31.17.179
      - APP_PORT=8082
      - EUREKA_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8761/eureka
      - CONFIG_SERVER_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8888
      - APP_NAME=users
      - PROFILE=default
      - MYSQL_DATABASE=${USER_DB_NAME}
      - MYSQL_USER=${USER_DB_USER}
      - MYSQL_PASSWORD=${USER_DB_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:5672/%2f
      - START_RABBITMQ_CONSUMER=true
      - FRONTEND_BASE_URL=https://dreamhouse237.onrender.com
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == app
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

  commentary-service:
    image: ${DOCKERHUB_USERNAME}/commentary-service:latest
    ports:
      - "8083:3003"
    volumes:
      - "./certs/global-bundle.pem:/certs/global-bundle.pem:ro"
    environment:
      - DATABASE_URL=${DB_URL_COMMENTARY}
      - APP_HOST=ec2-16-171-110-76.eu-north-1.compute.amazonaws.com
      - APP_PORT=8083
      - EUREKA_HOST=ec2-16-171-110-76.eu-north-1.compute.amazonaws.com
      - EUREKA_PORT=8761
      - EUREKA_IP_ADDR=172.31.17.179
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:5672/%2f
      - PORT=3003
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == app
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 128M

  publication-service:
    image: ${DOCKERHUB_USERNAME}/publication-service:latest
    ports:
      - "8085:8085"
    volumes:
      - "./certs/global-bundle.pem:/certs/global-bundle.pem:ro"
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - PUBLICATION_DB_USER=${PUBLICATION_DB_USER}
      - PUBLICATION_DB_PASSWORD=${PUBLICATION_DB_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JAVA_TOOL_OPTIONS=-Xmx96m -Xms48m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:CompressedClassSpaceSize=32m
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == app
      resources:
        limits:
          cpus: "0.20"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 192M

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service:latest
    ports:
      - "8086:8086"
    volumes:
      - "./certs/global-bundle.pem:/certs/global-bundle.pem:ro"
    environment:
      - HOST_IP=172.31.17.179
      - APP_PORT=8086
      - EUREKA_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8761/eureka
      - CONFIG_SERVER_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8888
      - MYSQL_USER=${PAYMENT_DB_USER}
      - MYSQL_PASSWORD=${PAYMENT_DB_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DB=${PAYMENT_DB_NAME}
      - RABBITMQ_HOST=ec2-16-171-110-76.eu-north-1.compute.amazonaws.com
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - CAMPAY_TOKEN=${CAMPAY_TOKEN}
      - CAMPAY_USERNAME=${CAMPAY_USERNAME}
      - CAMPAY_PASSWORD=${CAMPAY_PASSWORD}
      - CAMPAY_BASE_URL=https://demo.campay.net/api
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_USERNAME}
      - SECRET_KEY=${PAYMENT_SECRET_KEY}
      - PAYMENT_INIT_QUEUE=payment-queue
      - PAYMENT_STATUS_QUEUE=payment-status
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == app
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

  identity-verification-service:
    image: ${DOCKERHUB_USERNAME}/identity-verification-service:latest
    ports:
      - "8087:8087"
    volumes:
      - "./certs/global-bundle.pem:/certs/global-bundle.pem:ro"
    environment:
      - DJANGO_ENV=production
      - WORKER_ID=0
      - HOST_IP=172.31.17.179
      - APP_PORT=8087
      - EUREKA_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8761/eureka
      - CONFIG_SERVER_URL=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8888
      - APP_NAME=IDENTITY-SERVICE
      - PROFILE=default
      - MYSQL_DATABASE=${IDENTITY_DB_NAME}
      - MYSQL_USER=${IDENTITY_DB_USER}
      - MYSQL_PASSWORD=${IDENTITY_DB_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:5672/%2f
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == app
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

  proxy-service:
    image: ${DOCKERHUB_USERNAME}/proxy-service:latest
    networks:
      - traefik-net
    expose:
      - "8080"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == gateway
      resources:
        limits:
          cpus: "0.30"
          memory: 256M

  traefik:
    image: traefik:v3.3
    networks:
      - traefik-net
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--log.level=INFO"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=htchamba124@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
    volumes:
      - letsencrypt:/letsencrypt
      - "./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zone == gateway
      resources:
        limits:
          cpus: "0.20"
          memory: 128M