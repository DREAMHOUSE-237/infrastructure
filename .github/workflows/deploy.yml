name: Deploy to EC2

on:
  repository_dispatch:
    types:
      - deploy-auth-service
      - deploy-user-service
      - deploy-commentary-service
      - deploy-publication-service
      - deploy-payment-service
      - deploy-identity-verification-service
      - deploy-proxy-service
      - deploy-registry-service
      - deploy-config-service
      - deploy-messagebroker-service
  # Manual trigger: unlike "Re-run all jobs" (which replays the workflow
  # file as it was at that historical run's commit), this always runs the
  # current version of deploy.yml on main with fresh secrets. Use the
  # "Run workflow" button on this workflow's Actions page for a real
  # from-scratch redeploy.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets are set
        run: |
          missing=""
          check() { if [ -z "$2" ]; then missing="$missing $1"; fi; return 0; }
          check DOCKERHUB_USERNAME "${{ secrets.DOCKERHUB_USERNAME }}"
          check DB_URL_AUTH "${{ secrets.DB_URL_AUTH }}"
          check DB_URL_COMMENTARY "${{ secrets.DB_URL_COMMENTARY }}"
          check RABBITMQ_USER "${{ secrets.RABBITMQ_USER }}"
          check RABBITMQ_PASSWORD "${{ secrets.RABBITMQ_PASSWORD }}"
          check MYSQL_HOST "${{ secrets.MYSQL_HOST }}"
          check MYSQL_PORT "${{ secrets.MYSQL_PORT }}"
          check USER_DB_NAME "${{ secrets.USER_DB_NAME }}"
          check USER_DB_USER "${{ secrets.USER_DB_USER }}"
          check USER_DB_PASSWORD "${{ secrets.USER_DB_PASSWORD }}"
          check PAYMENT_DB_NAME "${{ secrets.PAYMENT_DB_NAME }}"
          check PAYMENT_DB_USER "${{ secrets.PAYMENT_DB_USER }}"
          check PAYMENT_DB_PASSWORD "${{ secrets.PAYMENT_DB_PASSWORD }}"
          check IDENTITY_DB_NAME "${{ secrets.IDENTITY_DB_NAME }}"
          check IDENTITY_DB_USER "${{ secrets.IDENTITY_DB_USER }}"
          check IDENTITY_DB_PASSWORD "${{ secrets.IDENTITY_DB_PASSWORD }}"
          check PUBLICATION_DB_USER "${{ secrets.PUBLICATION_DB_USER }}"
          check PUBLICATION_DB_PASSWORD "${{ secrets.PUBLICATION_DB_PASSWORD }}"
          check CLOUDINARY_CLOUD_NAME "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          check CLOUDINARY_API_KEY "${{ secrets.CLOUDINARY_API_KEY }}"
          check CLOUDINARY_API_SECRET "${{ secrets.CLOUDINARY_API_SECRET }}"
          check CAMPAY_TOKEN "${{ secrets.CAMPAY_TOKEN }}"
          check CAMPAY_USERNAME "${{ secrets.CAMPAY_USERNAME }}"
          check CAMPAY_PASSWORD "${{ secrets.CAMPAY_PASSWORD }}"
          check MAIL_USERNAME "${{ secrets.MAIL_USERNAME }}"
          check MAIL_PASSWORD "${{ secrets.MAIL_PASSWORD }}"
          check PAYMENT_SECRET_KEY "${{ secrets.PAYMENT_SECRET_KEY }}"
          check EC2_HOST "${{ secrets.EC2_HOST }}"
          check EC2_USER "${{ secrets.EC2_USER }}"
          check EC2_SSH_KEY "${{ secrets.EC2_SSH_KEY }}"
          if [ -n "$missing" ]; then
            echo "::error::Empty or missing GitHub secrets, deploy aborted:$missing"
            echo "Fix them in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout infrastructure repo
        uses: actions/checkout@v4

      - name: Deploy with SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          # The stack is deployed once against the swarm manager (EC2_HOST);
          # Swarm itself schedules each service onto EC2_HOST or EC2_HOST2
          # based on the node.labels.zone placement constraints in
          # docker-compose.prod.yml. There is no more per-service host pick.
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            SERVICE_TYPE="${{ github.event.action || 'manual trigger' }}"

            cd /home/ubuntu

            if [ ! -d "infrastructure" ]; then
              git clone https://github.com/DREAMHOUSE-237/infrastructure.git
            fi

            cd infrastructure

            if [ ! -d ".git" ]; then
              cd ..
              rm -rf infrastructure
              git clone https://github.com/DREAMHOUSE-237/infrastructure.git
              cd infrastructure
            fi

            git fetch origin main
            git reset --hard origin/main

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export DB_URL_AUTH=${{ secrets.DB_URL_AUTH }}
            export DB_URL_COMMENTARY=${{ secrets.DB_URL_COMMENTARY }}
            export RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            export RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            export MYSQL_HOST=${{ secrets.MYSQL_HOST }}
            export MYSQL_PORT=${{ secrets.MYSQL_PORT }}
            export USER_DB_NAME=${{ secrets.USER_DB_NAME }}
            export USER_DB_USER=${{ secrets.USER_DB_USER }}
            export USER_DB_PASSWORD=${{ secrets.USER_DB_PASSWORD }}
            export PAYMENT_DB_NAME=${{ secrets.PAYMENT_DB_NAME }}
            export PAYMENT_DB_USER=${{ secrets.PAYMENT_DB_USER }}
            export PAYMENT_DB_PASSWORD=${{ secrets.PAYMENT_DB_PASSWORD }}
            export IDENTITY_DB_NAME=${{ secrets.IDENTITY_DB_NAME }}
            export IDENTITY_DB_USER=${{ secrets.IDENTITY_DB_USER }}
            export IDENTITY_DB_PASSWORD=${{ secrets.IDENTITY_DB_PASSWORD }}
            export PUBLICATION_DB_USER=${{ secrets.PUBLICATION_DB_USER }}
            export PUBLICATION_DB_PASSWORD=${{ secrets.PUBLICATION_DB_PASSWORD }}
            export CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            export CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            export CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            export CAMPAY_TOKEN=${{ secrets.CAMPAY_TOKEN }}
            export CAMPAY_USERNAME=${{ secrets.CAMPAY_USERNAME }}
            export CAMPAY_PASSWORD=${{ secrets.CAMPAY_PASSWORD }}
            export MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            export MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            export PAYMENT_SECRET_KEY=${{ secrets.PAYMENT_SECRET_KEY }}

            echo "🚀 Déploiement de la stack (déclenché par ${SERVICE_TYPE})..."
            # --resolve-image always forces Swarm to re-check the :latest
            # digest on the registry, otherwise it would treat an unchanged
            # image tag as "nothing to update" even after a new push.
            docker stack deploy -c docker-compose.prod.yml --resolve-image always --with-registry-auth dreamhouse
            docker stack services dreamhouse
